x-env: &env
  environment:
    - ADMIN_EMAIL=admin@example.com
    - ADMIN_PASSWORD=password
    - ALLOWED_HOSTS=*
    - CACHE_DEFAULT=redis://redis:6379/0
    - CELERY_BROKER_URL=redis://host.docker.internal:6379/0
    - CSRF_COOKIE_SECURE=False
    - CSRF_TRUSTED_ORIGINS=http://localhost:8000
    - DATABASE_URL=postgres://postgres:password@db:5432/hope_documents
    - DEBUG=1
    - DJANGO_ADMIN_URL=admin/
    - DJANGO_SETTINGS_MODULE=hope_documents.config.settings
    - FERNET_KEY=123
    - FILE_STORAGE_HOPE=storages.backends.azure_storage.AzureStorage?azure_container=hope&connection_string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
    - STREAMING_BROKER_URL=rabbit://guest:guest@rabbitmq:5672/?vhost=/&exchange=hope_live
    - LOGGING_LEVEL=DEBUG
    - SECRET_KEY=super-secret-key-just-for-testing
    - SESSION_COOKIE_DOMAIN=http://localhost:8000
    - SOCIAL_AUTH_REDIRECT_IS_HTTPS=False

services:
  app:
    image: unicef/hope_documents:local
    <<: [ *env ]
    ports:
      - 8000:8000
    platform: linux/amd64
    command: "run"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      azurite:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
    volumes:
      - azurite_data:/data
    restart: always
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "10000" ]
      start_period: 5s
      start_interval: 1s
      interval: 5s
      timeout: 4s
      retries: 5

  db:
    image: postgres:16
    restart: always
    platform: linux/amd64
    environment:
      POSTGRES_DB: hope_documents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "postgres", "-d", "hope_documents" ]
      start_period: 5s
      start_interval: 1s
      interval: 5s
      timeout: 4s
      retries: 5

  redis:
    image: redis
    platform: linux/amd64
    <<: [ *env ]
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      start_period: 10s
      start_interval: 1s
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    image: unicef/hope_documents:local
    <<: [ *env ]
    platform: linux/amd64
    command: "worker"
    volumes:
      - ./bin/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      azurite:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  stream_listener:
    image: unicef/hope_documents:local
    <<: [ *env ]
    platform: linux/amd64
    command: "streaming"
    volumes:
      - ./bin/docker-entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy


volumes:
  postgres_data:
  azurite_data:
